<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKURO ARMY | Join Now</title>
    
    <style>
        :root {
            --tg-blue: #229ED9;
            --bg-dark: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }

        /* Header */
        .tg-header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            gap: 15px;
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            object-fit: cover;
        }

        .header-info h1 { font-size: 17px; font-weight: 700; }
        .header-info p { font-size: 13px; color: var(--tg-blue); margin-top: 1px; }

        /* Hero Fading Image */
        .hero-img-container {
            width: 100%;
            height: 400px;
            background-image: url('https://i.ibb.co/nNmyZhGd/IMG-20260820-WA0150.jpg');
            background-size: cover;
            background-position: center top;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .content-area {
            padding: 0 20px;
            margin-top: -80px;
            z-index: 5;
        }

        /* Join Button */
        .join-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--tg-blue);
            border-radius: 14px;
            color: white;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(34, 158, 217, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stat-n { font-size: 16px; font-weight: 800; }
        .stat-l { font-size: 10px; color: var(--text-gray); text-transform: uppercase; margin-top: 4px;}

        /* Footer */
        .footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 10px;
        }
        .footer span { color: var(--tg-blue); font-weight: 600; }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="tg-header">
            <img src="https://i.ibb.co/nNmyZhGd/IMG-20260820-WA0150.jpg" class="header-icon">
            <div class="header-info">
                <h1>AKURO ARMY</h1>
                <p>Private VIP Channel</p>
            </div>
        </header>

        <!-- Hero Image -->
        <div class="hero-img-container"></div>

        <div class="content-area">
            <!-- Join Button -->
            <a href="https://telegram.me/+nXLmnJmha-4wNjVl" class="join-btn">
                JOIN CHANNEL
            </a>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-n">99%</div>
                    <div class="stat-l">Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-n">24/7</div>
                    <div class="stat-l">Support</div>
                </div>
                <div class="stat-card">
                    <div class="stat-n">100%</div>
                    <div class="stat-l">Secure</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                Ads manage by <span>@senorita_xoxo</span>
            </div>
        </div>
    </div>
</body>
</html>
