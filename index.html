<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKURO ARMY</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            overflow: hidden; /* Background fixed */
        }

        /* Telegram Blurred Background */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Simulating chat bubbles/background */
            background: #eef2f5; 
            background-image: 
                linear-gradient(135deg, #d1d9e0 25%, transparent 25%),
                linear-gradient(225deg, #d1d9e0 25%, transparent 25%);
            background-size: 80px 80px;
            filter: blur(12px);
            z-index: -1;
        }

        /* Container for Centering */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Telegram Card */
        .tg-card {
            background: #ffffff;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            text-align: center;
            border-radius: 24px;
            /* Black Outline/Border requested */
            border: 2px solid #000000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .channel-name {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }

        .verified-badge {
            background: #2481cc;
            color: white;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 50%;
        }

        .subscribers {
            font-size: 14px;
            color: #707579;
            margin-bottom: 20px;
        }

        .description {
            font-size: 15px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .join-btn {
            display: block;
            background: #2481cc;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }

        .join-btn:hover {
            background: #1c6ba8;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Blurred Telegram Interface Background -->
    <div class="bg-blur"></div>

    <div class="wrapper">
        <div class="tg-card">
            <img src="https://i.ibb.co/nNmyZhGd/IMG-20260820-WA0150.jpg" class="profile-pic" alt="AKURO ARMY">
            
            <div class="channel-name">
                AKURO ARMY <span class="verified-badge">✓</span>
            </div>
            
            <div class="subscribers">185,420 subscribers</div>
            
            <div class="description">
                Welcome to the official VIP channel. Join us for premium signals, market updates, and exclusive insights.
            </div>

            <a href="https://telegram.me/+nXLmnJmha-4wNjVl" class="join-btn">Join Channel</a>

            <div class="footer">
                Ads managed by @senorita_xoxo
            </div>
        </div>
    </div>

</body>
</html>
