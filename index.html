<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKURO ARMY</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5; /* Telegram background grey */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tg-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 20px;
            margin: 10px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid #f0f0f0;
        }

        .channel-name {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            background: #2481cc;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .subscribers {
            font-size: 15px;
            color: #707579;
            margin-bottom: 20px;
        }

        .description {
            font-size: 16px;
            color: #333;
            line-height: 1.4;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .join-btn {
            display: block;
            background: #2481cc;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 17px;
            transition: background 0.2s;
        }

        .join-btn:active {
            background: #1e69a6;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="tg-card">
        <img src="https://i.ibb.co/nNmyZhGd/IMG-20260820-WA0150.jpg" class="profile-pic" alt="AKURO ARMY">
        
        <div class="channel-name">
            AKURO ARMY <span class="verified-badge">✓</span>
        </div>
        
        <div class="subscribers">185,420 subscribers</div>
        
        <div class="description">
            Welcome to the official VIP channel. Join us for premium signals, market updates, and exclusive insights.
        </div>

        <a href="https://telegram.me/+nXLmnJmha-4wNjVl" class="join-btn">Join Channel</a>

        <div class="footer">
            Ads managed by @senorita_xoxo
        </div>
    </div>

</body>
</html>
